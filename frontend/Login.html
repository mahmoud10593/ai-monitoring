<!DOCTYPE html>
<html>
<head>
    <title>Etmam AI Monitor - Login</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
        }

        .login-box {
            background: rgba(34, 34, 41, 0.685);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            height: 60px;
        }

        h2 {
            margin: 10px 0 20px;
            color: #ffffff;
        }

        input {
            width: 92%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 20px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img src="https://www.e-tec.sa/wp-content/uploads/2024/05/logo.png">
    </div>

    <h2>Etmam AI Monitor</h2>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="footer">
        Secure Monitoring System
    </div>

</div>

<script>
function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if (u === "admin" && p === "1234") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "index.html";
    } else {
        alert("Wrong credentials");
    }
}
</script>

</body>
</html>
